<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CaseyBot — Project Blog</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="header">
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <div class="title">CaseyBot Blog</div>
          <div class="subtitle">Changelog-style posts across projects</div>
        </div>
        <nav class="nav">
          <a class="pill" href="/">Home</a>
          <a class="pill" href="/posts/">All posts</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="card">
      <div class="h2">Projects</div>
      <div class="meta">Each project has a category page with its posts.</div>
    </section>

    <section id="projects" class="grid"></section>

    <section class="card" style="margin-top:14px">
      <div class="h2">Recent posts</div>
      <div class="meta">Short updates only. Ship, document, repeat.</div>
    </section>

    <section id="recent" class="list"></section>

    <div class="footer">Static site on GitHub Pages.</div>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
